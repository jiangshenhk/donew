<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易机器人中心</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='28' height='28' rx='6' fill='%234da8ff'/><text x='16' y='23' font-size='18' font-family='PingFang SC,sans-serif' font-weight='bold' text-anchor='middle' fill='white'>交</text></svg>">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  background: linear-gradient(135deg, #0d1522 0%, #13203a 100%);
  color: #d4dae6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
h1 {
  font-size: 1.8rem;
  color: #e8edf5;
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.subtitle {
  color: #6b7fa3;
  font-size: 0.9rem;
  margin-bottom: 40px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
  width: 100%;
  max-width: 900px;
}
.card {
  background: #162234;
  border: 1px solid #2a3a52;
  border-radius: 12px;
  padding: 28px 24px;
  text-decoration: none;
  color: inherit;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  display: block;
}
.card:hover {
  transform: translateY(-4px);
  border-color: #4da8ff;
  box-shadow: 0 8px 24px rgba(77,168,255,0.15);
}
.card .icon {
  font-size: 2.2rem;
  margin-bottom: 14px;
}
.card h2 {
  font-size: 1.2rem;
  color: #e8edf5;
  margin-bottom: 8px;
}
.card p {
  font-size: 0.85rem;
  color: #6b7fa3;
  line-height: 1.6;
}
.card .badge {
  display: inline-block;
  margin-top: 12px;
  font-size: 0.75rem;
  padding: 3px 10px;
  border-radius: 20px;
  color: #b0c4e8;
  background: rgba(77,168,255,0.12);
}
.short { border-left: 4px solid #45d483; }
.long { border-left: 4px solid #4da8ff; }
.agent { border-left: 4px solid #ffd54a; }
.footer {
  margin-top: 40px;
  color: #4a5e7a;
  font-size: 0.75rem;
}
</style>
</head>
<body>
  <h1>🤖 交易机器人中心</h1>
  <div class="subtitle">短线 / 长线 / Sell Put 自动化交易仪表板</div>

  <div class="grid">
    <a class="card short" href="/trader-dashboard.html">
      <div class="icon">⚡</div>
      <h2>短线交易机器人</h2>
      <p>5分钟K线 + 技术规则 + AI评分，自动开平仓，BTC 24小时运行</p>
      <span class="badge">每5分钟</span>
    </a>
    <a class="card long" href="/long-trader-dashboard.html">
      <div class="icon">📈</div>
      <h2>长线交易机器人</h2>
      <p>周线定方向 + 日线进场，美股/港股/BTC，宽止损止盈</p>
      <span class="badge">每日3时段</span>
    </a>
    <a class="card agent" href="/api/agent/dashboard">
      <div class="icon">💰</div>
      <h2>Sell Put Agent</h2>
      <p>卖Put自动决策 + 纸面交易跟踪 + 期权温度分析</p>
      <span class="badge">每日</span>
    </a>
  </div>

  <div class="footer">donew · v1.0</div>
</body>
</html>
