name: Generate Market Daily and Weekly Reports

on:
  schedule:
    # 香港时间 8:28 早报（周一至周五）→ UTC 周日-周四 00:28
    - cron: '28 0 * * 0-4'
    # 香港时间 8:58 早报兜底（防排队延迟）
    - cron: '58 0 * * 1-5'
    # 香港时间 20:28 晚报（周一至周五）→ UTC 周一至周五 12:28
    - cron: '28 12 * * 1-5'
    # 香港时间 20:58 晚报兜底（防排队延迟）
    - cron: '58 12 * * 1-5'
    # 香港时间 周六 9:00 周报 → UTC 周六 01:00
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      report_type:
        description: Report type
        required: true
        default: morning
        type: choice
        options:
          - morning
          - evening
          - weekly

permissions:
  contents: write

concurrency:
  group: generate-market-report-${{ github.event.schedule || github.event.inputs.report_type || 'manual' }}
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Select report type
        id: report
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_REPORT_TYPE: ${{ inputs.report_type }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "type=$INPUT_REPORT_TYPE" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "28 0 * * 0-4" ] || [ "$EVENT_SCHEDULE" = "58 0 * * 1-5" ]; then
            echo "type=morning" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "0 1 * * 6" ]; then
            echo "type=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "type=evening" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify strategy baseline
        run: |
          test -s "docs/SellPut/日报周报/策略_每日市场判断怎么看GPT提示词.md"
          grep -q "QLD" "docs/SellPut/日报周报/策略_每日市场判断怎么看GPT提示词.md"
          grep -q "MSTR" "docs/SellPut/日报周报/策略_每日市场判断怎么看GPT提示词.md"
          grep -q "INTC" "docs/SellPut/日报周报/策略_每日市场判断怎么看GPT提示词.md"

      - name: Skip if report already generated
        id: skip
        shell: bash
        env:
          TYPE: ${{ steps.report.outputs.type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HK_DATE=$(TZ=Asia/Hong_Kong date +%F)
          if [ "$TYPE" = "weekly" ]; then
            FILE="docs/市场/${HK_DATE}市场结构周报.md"
          else
            LABEL=$([ "$TYPE" = "morning" ] && echo "早报" || echo "晚报")
            FILE="docs/市场/${HK_DATE}市场结构日报(${LABEL}).md"
          fi
          if [ -f "$FILE" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "已存在 $FILE，跳过生成（本次为调度触发的兜底检查）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and validate report
        if: steps.skip.outputs.skip != 'true'
        run: node scripts/test-market-daily-report.mjs "${{ steps.report.outputs.type }}"

      - name: Commit report files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/市场/
          git diff --cached --quiet && exit 0
          git commit -m "Generate market ${{ steps.report.outputs.type }} report"
          git pull --rebase origin main
          git push origin HEAD:main
