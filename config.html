<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易机器人配置</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='28' height='28' rx='6' fill='%234da8ff'/><text x='16' y='23' font-size='18' font-family='PingFang SC,sans-serif' font-weight='bold' text-anchor='middle' fill='white'>配</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:#0d1522;color:#d4dae6;min-height:100vh}
.header{background:linear-gradient(135deg,#1a2740 0%,#0f1b2e 100%);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a3a52}
.header h1{font-size:1.3rem;color:#e8edf5}
.header a{color:#4da8ff;text-decoration:none;font-size:.85rem}
.content{max-width:900px;margin:0 auto;padding:20px 24px}
.card{background:#162234;border:1px solid #2a3a52;border-radius:8px;padding:20px;margin-bottom:16px}
.card h2{font-size:16px;color:#e8edf5;margin-bottom:12px}
.symbols{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sym{background:#1a2b42;border:1px solid #2a3a52;padding:6px 12px;border-radius:6px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.sym .tag{font-size:10px;padding:2px 6px;border-radius:8px}
.tag-us{background:rgba(77,168,255,.15);color:#4da8ff}
.tag-hk{background:rgba(255,213,74,.15);color:#ffd54a}
.tag-btc{background:rgba(255,107,125,.12);color:#ff6b7d}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.stat{padding:8px 14px;background:#1a2b42;border-radius:6px;font-size:12px}
.stat .label{color:#4a5e7a;font-size:11px}
.stat .value{color:#b0c4e8;margin-top:2px}
.empty{text-align:center;padding:40px;color:#4a5e7a}
.footer{margin-top:40px;text-align:center;color:#4a5e7a;font-size:.75rem;padding-bottom:30px}
.badge-short{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(69,212,131,.15);color:#45d483;margin-left:8px}
.badge-long{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(77,168,255,.15);color:#4da8ff;margin-left:8px}
</style>
</head>
<body>
<div class="header">
  <h1>交易机器人配置</h1>
  <a href="/trading.html">返回导航</a>
</div>
<div class="content" id="app">
  <p style="text-align:center;color:#4a5e7a;padding:40px">加载中...</p>
</div>
<div class="footer">donew · v2.0</div>
<script>
(async function(){
  var app=document.getElementById('app');
  function tag(sym){
    if(/\\.HK$/i.test(sym)) return 'tag-hk';
    if(/BTC/i.test(sym)) return 'tag-btc';
    return 'tag-us';
  }
  function market(sym){
    if(/\\.HK$/i.test(sym)) return '港股';
    if(/BTC/i.test(sym)) return '24h';
    return '美股';
  }
  function card(title,badge,config){
    var syms=config.symbols||[];
    var h='<div class="card"><h2>'+title+' <span class="'+badge+'">'+syms.length+'个标的</span></h2>';
    h+='<div class="symbols">';
    for(var i=0;i<syms.length;i++){
      var s=syms[i];
      h+='<span class="sym">'+s+' <span class="tag '+tag(s)+'">'+market(s)+'</span></span>';
    }
    h+='</div><div class="stats">';
    h+='<div class="stat"><div class="label">资金</div><div class="value">$'+(config.capital||0).toLocaleString()+'</div></div>';
    h+='<div class="stat"><div class="label">单笔仓位</div><div class="value">$'+(config.positionSize||0).toLocaleString()+'</div></div>';
    h+='<div class="stat"><div class="label">最大持仓</div><div class="value">'+(config.maxPositions||0)+'</div></div>';
    h+='<div class="stat"><div class="label">模型</div><div class="value">'+(config.model||'?')+'</div></div>';
    if(config.fxRate) h+='<div class="stat"><div class="label">汇率 HKD/USD</div><div class="value">'+config.fxRate+'</div></div>';
    h+='</div></div>';
    return h;
  }
  var html='';
  try{
    var r=await fetch('/trader-dashboard.html');
    var t=await r.text();
    var m=t.match(/const DATA = ({[\\s\\S]*?});\\s*function/);
    if(m){ var d=JSON.parse(m[1]); html+=card('短线交易机器人','badge-short',d.config); }
  }catch(e){ html+='<p>短线: '+e.message+'</p>'; }
  try{
    var r=await fetch('/long-trader-dashboard.html');
    var t=await r.text();
    var m=t.match(/const DATA = ({[\\s\\S]*?});\\s*const/);
    if(m){ var d=JSON.parse(m[1]); html+=card('长线交易机器人','badge-long',d.config); }
  }catch(e){ html+='<p>长线: '+e.message+'</p>'; }
  app.innerHTML=html||'<p style="text-align:center;color:#4a5e7a">无法读取</p>';
})();
</script>
</body>
</html>
